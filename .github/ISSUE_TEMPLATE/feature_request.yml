name: ✨ Feature Request
description: Entry-Sync에 새로운 기능이나 개선 사항을 제안해주세요.
title: "[Feature] "
labels:
  - enhancement

body:
  - type: markdown
    attributes:
      value: |
        ## ✨ 기능 제안

        Entry-Sync를 더 좋게 만들 수 있는 아이디어를 제안해주세요.

  - type: textarea
    id: problem
    attributes:
      label: 문제점
      description: 현재 어떤 불편함이나 문제가 있는지 설명해주세요.
      placeholder: 현재 여러 기기에서 데이터를 관리하기가 불편합니다.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 제안하는 기능
      description: 어떤 기능을 추가하면 좋을지 설명해주세요.
      placeholder: 여러 기기 간 설정도 자동으로 동기화할 수 있으면 좋겠습니다.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 기대하는 결과
      description: 이 기능이 추가되면 어떤 점이 좋아지는지 설명해주세요.
      placeholder: 여러 기기에서 동일한 설정을 사용할 수 있습니다.

  - type: textarea
    id: examples
    attributes:
      label: 참고 자료
      description: 관련 이미지, 예시, 링크 등이 있다면 첨부해주세요.

  - type: textarea
    id: additional
    attributes:
      label: 추가 정보
      description: 추가로 설명하고 싶은 내용이 있다면 작성해주세요.
